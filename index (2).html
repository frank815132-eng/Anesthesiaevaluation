<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>麻醉評估問卷</title>
<style>
  :root{
    --ink:#0B2B2C; --teal:#0E7C7B; --teal-dark:#0A5C5B;
    --mist:#EEF4F3; --line:#CFDEDC; --white:#FFF;
    --alert:#B3261E; --alert-bg:#FDECEA;
    --note:#8A5A00; --note-bg:#FFF6E5; --note-line:#EDCE8F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"微軟正黑體","Microsoft JhengHei","PingFang TC",sans-serif;
    background:var(--mist);color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;background:var(--white);}

  /* ── 進度列 ── */
  header{padding:14px 22px 12px;border-bottom:1px solid var(--line);flex:none;}
  .bar{display:flex;gap:6px;}
  .seg{flex:1;height:12px;border-radius:99px;background:var(--line);transition:background .25s;}
  .seg.done{background:var(--teal);}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .count{font-size:clamp(18px,2.9vw,26px);font-weight:800;color:var(--teal-dark);}
  .back{font-size:clamp(18px,2.9vw,26px);color:#5B7574;background:none;border:none;font-family:inherit;padding:4px 2px;font-weight:600;}
  .back[hidden]{visibility:hidden;display:block;}

  /* ── 題目區：撐滿，不留空白 ── */
  main{flex:1;display:flex;flex-direction:column;padding:16px 22px;overflow:hidden;min-height:0;}
  .q{font-size:clamp(28px,5.8vw,50px);font-weight:800;line-height:1.3;}
  .sub{font-size:clamp(19px,3.4vw,30px);color:#5B7574;line-height:1.5;margin-top:8px;}
  .hint{font-size:clamp(17px,2.8vw,24px);color:#7C9594;margin-top:8px;}
  .opts{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);margin-top:clamp(14px,2.4vh,26px);min-height:0;}

  .opt{
    flex:1 1 0;min-height:clamp(74px,10vh,140px);
    display:flex;align-items:center;gap:clamp(14px,2.6vw,24px);
    padding:0 clamp(18px,3vw,28px);
    font-family:inherit;font-size:clamp(24px,5vw,42px);font-weight:800;text-align:left;
    background:var(--white);color:var(--ink);
    border:3px solid var(--line);border-radius:20px;
    transition:transform .08s,border-color .15s,background .15s;
  }
  .opt:active{transform:scale(.985);}
  .opt .tick{
    flex:none;width:clamp(34px,5.4vw,48px);height:clamp(34px,5.4vw,48px);
    border-radius:50%;border:3px solid var(--line);position:relative;transition:.15s;
  }
  .opt.on{border-color:var(--teal);background:#E4F1F0;}
  .opt.on .tick{background:var(--teal);border-color:var(--teal);}
  .opt.on .tick::after{
    content:"";position:absolute;left:32%;top:14%;width:26%;height:52%;
    border:solid var(--white);border-width:0 5px 5px 0;transform:rotate(43deg);
  }
  .emo{font-size:1.05em;flex:none;}
  .pre{
    flex:none;padding:.12em .5em;border-radius:12px;
    font-weight:900;letter-spacing:.05em;
  }
  .pre.yes{background:#FDECEA;color:var(--alert);border:2.5px solid #F0B4AE;}
  .pre.no {background:#E4F1F0;color:var(--teal-dark);border:2.5px solid #9CC9C6;}

  /* ── 衛教提醒卡：撐滿版面 ── */
  .notice{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,34px);
    background:var(--note-bg);border:3px solid var(--note-line);border-radius:24px;
    padding:clamp(22px,4vw,44px);text-align:center;min-height:0;
  }
  .notice .q{color:var(--note);font-size:clamp(30px,6.4vw,56px);}
  .notice ul{list-style:none;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,20px);}
  .notice li{font-size:clamp(23px,4.6vw,38px);font-weight:700;line-height:1.45;}

  .warn{
    color:var(--alert);background:#FDECEA;border:3px solid #F0B4AE;border-radius:16px;
    font-size:clamp(24px,4.8vw,40px);font-weight:800;line-height:1.4;
    padding:clamp(12px,2vh,20px) clamp(14px,2.4vw,22px);
  }

  /* ── 底部按鈕 ── */
  footer{flex:none;padding:12px 22px calc(14px + env(safe-area-inset-bottom));}
  .cta{
    width:100%;min-height:clamp(80px,9.5vh,124px);border:none;border-radius:20px;
    font-family:inherit;font-size:clamp(25px,5vw,40px);font-weight:800;
    background:var(--teal);color:var(--white);transition:transform .08s;
  }
  .cta:active{transform:scale(.99);}
  .cta:disabled{background:#C8D8D6;color:#87A09E;}
  footer.quiet{display:flex;justify-content:flex-end;padding:6px 22px calc(10px + env(safe-area-inset-bottom));}
  footer.quiet button{
    background:none;border:none;font-family:inherit;
    font-size:15px;color:#A8BCBA;padding:8px 6px;text-decoration:underline;
  }

  /* ── 開始 / 結束 ── */
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(14px,2.6vh,26px);padding:24px;}
  .big{font-size:clamp(34px,7.4vw,62px);font-weight:800;line-height:1.3;}
  .lead{font-size:clamp(20px,3.8vw,32px);color:#5B7574;line-height:1.65;}
  .mark{font-size:clamp(70px,15vw,130px);line-height:1;}

  /* ── 結果總表（給醫師：一眼看完）── */
  #summary{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.4vh,14px);padding:18px 22px;overflow:hidden;-webkit-user-select:text;user-select:text;}
  .shead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:clamp(6px,1.2vh,14px);}
  .shead b{font-size:clamp(28px,5.2vw,44px);color:var(--teal-dark);line-height:1.3;}
  .shead span{font-size:clamp(15px,2.4vw,20px);color:#7C9594;}
  .row{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:clamp(9px,1.6vh,16px) 4px;}
  .row .lbl{flex:none;width:9.5em;font-size:clamp(17px,2.6vw,22px);color:#5B7574;font-weight:600;}
  .row .val{font-size:clamp(21px,3.6vw,30px);font-weight:800;line-height:1.3;}
  .row.flag{background:var(--alert-bg);border-radius:12px;padding-left:12px;padding-right:12px;border-bottom-color:transparent;}
  .row.flag .val{color:var(--alert);}
  .row.flag .lbl{color:#8C3A33;}
  .row.ok .val{color:#5B7574;}
  .edu{font-size:clamp(16px,2.4vw,21px);color:#5B7574;padding-top:6px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STEPS = [
  { key:"過敏", type:"multi", q:"有藥物或食物過敏嗎？", sub:"可以複選",
    opts:[{pre:"有",t:"藥物過敏",e:"💊",flag:1},
          {pre:"有",t:"食物過敏",e:"🍤",flag:1},
          {pre:"沒有",t:"過敏",e:"🙂",none:true}] },

  { key:"抽菸、喝酒、吃檳榔", type:"multi", q:"有抽菸、喝酒、吃檳榔嗎？", sub:"可以複選",
    opts:[{t:"都沒有",e:"🙂",none:true},{t:"抽菸",e:"🚬",flag:1},{t:"喝酒",e:"🍶",flag:1},{t:"吃檳榔",e:"🌿",flag:1}] },

  { key:"術前禁菸酒檳榔", type:"notice", q:"手術當天不可吸菸、喝酒、吃檳榔",
    lines:[],
    warn:"未遵守，手術會取消", btn:"我知道了" },

  { key:"牙齒情況", type:"multi", q:"牙齒情況？", sub:"可以複選",
    opts:[{t:"都沒有",e:"🙂",none:true},{t:"有鬆動的牙齒",e:"🦷",flag:1},{t:"有活動假牙",e:"🦷",flag:1},{t:"有固定假牙、植牙",e:"🦷"}] },

  { key:"減重針劑", type:"single", hold:true, q:"有打瘦瘦針或吃減重藥嗎？",
    sub:"例如：猛健樂、善纖達、胰妥讚、週纖達",
    opts:[{t:"有",e:"💉",flag:1},{t:"沒有",e:"🙂"}] },

  { key:"指甲提醒", type:"notice", q:"手術前請卸除",
    lines:["指甲油","水晶指甲、光療指甲"],
    warn:"沒有卸除，手術會取消", btn:"我知道了" },

  { key:"術前問診", type:"notice", q:"等一下醫師會問您：",
    lines:["有沒有慢性病、長期吃的藥","開過什麼刀、麻醉後有沒有不舒服"], btn:"我想好了" }
];

let idx = -1;
const ans = STEPS.map(()=>[]);
const app = document.getElementById("app");
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

function render(){
  if(idx === -1)          return renderStart();
  if(idx >= STEPS.length) return renderDone();
  renderStep();
}

function renderStart(){
  app.innerHTML = `
    <div class="center">
      <div class="mark">🩺</div>
      <div class="big">麻醉評估問卷</div>
      <div class="lead">總共 ${STEPS.length} 題，大約 1 分鐘<br>請用手指直接點選答案</div>
    </div>
    <footer><button class="cta" id="go">開始作答</button></footer>`;
  document.getElementById("go").onclick = ()=>{ buzz(12); idx=0; render(); };
}

function renderStep(){
  const s = STEPS[idx], picked = ans[idx];
  const needBtn = s.type === "multi" || s.hold;
  const segs = STEPS.map((_,i)=>`<div class="seg ${i<idx?'done':''}"></div>`).join("");

  const body = s.type === "notice"
    ? `<div class="notice">
         <div class="q">${s.q}</div>
         ${s.lines.length ? `<ul>${s.lines.map(l=>`<li>${l}</li>`).join("")}</ul>` : ""}
         ${s.warn ? `<div class="warn">⚠ ${s.warn}</div>` : ""}
       </div>`
    : `<div class="q">${s.q}</div>
       ${s.sub ? `<div class="sub">${s.sub}</div>` : ""}
       ${needBtn ? `<div class="hint">選好後請按下面的「下一題」</div>` : ""}
       <div class="opts">${s.opts.map((o,i)=>
         `<button class="opt ${picked.includes(i)?'on':''}" data-i="${i}">
            <span class="tick"></span><span class="emo">${o.e}</span>${o.pre?`<span class="pre ${o.none?"no":"yes"}">${o.pre}</span>`:""}<span>${o.t}</span>
          </button>`).join("")}</div>`;

  const foot = needBtn
    ? `<button class="cta" id="next" ${picked.length?"":"disabled"}>下一題 ›</button>`
    : s.type === "notice" ? `<button class="cta" id="next">${s.btn}</button>` : "";

  app.innerHTML = `
    <header>
      <div class="bar">${segs}</div>
      <div class="meta">
        <button class="back" ${idx===0?"hidden":""}>‹ 上一題</button>
        <span class="count">第 ${idx+1} 題 ／ 共 ${STEPS.length} 題</span>
      </div>
    </header>
    <main>${body}</main>
    <footer>${foot}</footer>`;

  const back = app.querySelector(".back");
  if(back) back.onclick = ()=>{ buzz(8); idx--; render(); };

  app.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.i, o = s.opts[i];
      buzz(12);
      if(s.type === "single"){
        ans[idx] = [i];
        if(s.hold){ render(); return; }
        btn.classList.add("on");
        setTimeout(()=>{ idx++; render(); }, 260);
        return;
      }
      let set = new Set(ans[idx]);
      if(o.none) set = set.has(i) ? new Set() : new Set([i]);
      else {
        s.opts.forEach((oo,j)=> oo.none && set.delete(j));
        set.has(i) ? set.delete(i) : set.add(i);
      }
      ans[idx] = [...set];
      render();
    };
  });

  const next = document.getElementById("next");
  if(next) next.onclick = ()=>{
    buzz(12);
    if(s.type === "notice") ans[idx] = [0];
    idx++; render();
  };
}

function renderDone(){
  const rows = STEPS.filter(s=>s.type!=="notice").map(s=>{
    const chosen = ans[STEPS.indexOf(s)].map(j=>s.opts[j]);
    const flag = chosen.some(o=>o.flag);
    return `<div class="row ${flag?'flag':'ok'}">
      <div class="lbl">${s.key}</div>
      <div class="val">${flag?"⚠ ":""}${chosen.map(o=>(o.pre||"")+o.t).join("、")||"—"}</div></div>`;
  }).join("");

  const t = new Date();
  const time = `${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`;

  app.innerHTML = `
    <div id="summary">
      <div class="shead"><b>✅ 完成問卷，將平板給醫師</b><span>${time}</span></div>
      ${rows}
      <div class="edu">衛教已告知：術前禁菸、卸除指甲、術前問診項目</div>
    </div>
    <footer class="quiet"><button id="reset">下一位病人（清除重填）</button></footer>`;

  document.getElementById("reset").onclick = ()=>{
    if(!confirm("確定要清除並換下一位病人嗎？")) return;
    ans.forEach(a=>a.length=0); idx=-1; render();
  };
}
render();
</script>
</body>
</html>
